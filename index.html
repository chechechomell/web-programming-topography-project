<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지형 등고선 기반 대화형 지역 탐색</title>
    <!--css leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header>
        <h1 data-i18n="title">지형 등고선 & 지역 탐색 플랫폼</h1>
        <!--change language button-->
        <div class="lang-switch">
            <button id="btn-ko" class="active" onclick="setLanguage('ko')">한국어</button>
            <button id="btn-en" onclick="setLanguage('en')">English</button>
        </div>
    </header>

    <div class="containers">
        <!--sidebar-->
        <aside class="sidebar">
            <div class="control-card">
                <h2 data-i18n="layerControl">지형 레이어 제어</h2>
                <label class="toggle-row">
                    <span data-i18n="contourLabel">등고선 레이어 표시</span>
                    <div class="switch">
                        <input type="checkbox" id="toggleContour" checked>
                        <span class="slider"></span>
                    </div>
                </label>
            </div>

            <div class="control-card">
                <h2 data-i18n="landmarksTitle">주요 지형 랜드마크</h2>
                <div id="landmarkButtons" class="landmark-grid"></div>
                <div id="landmarkSummary" class="landmark-summary"></div>
            </div>

            <div class="control-card">
                <h2 data-i18n="regionInfo">지역 정보</h2>
                <div id="infoPanel" data-i18n="infoPrompt">지도를 클릭하여 표고 및 위치 정보를 확인하세요.</div>
            </div>
        </aside>

        <main id="map"></main>
    </div>
    
    <!--scriptsss-->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/main.js"></script>
    <script src="js/lang.js"></script>
</body>

</html>
